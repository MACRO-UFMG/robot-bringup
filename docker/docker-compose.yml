services:
  pioneer_bringup:
    build: ../src/pioneer_bringup
    profiles: ["pioneer"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    env_file:
      - ../config/.env

  scout_bringup:
    build: ../src/scout_bringup
    profiles: ["scout"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    env_file:
      - ../config/.env

  realsense2_camera_bringup:
    build: ../src/realsense2_camera_bringup
    profiles: ["realsense2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env

  robot_bringup:
    build: ../src/robot_bringup
    profiles: ["ros_base"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env

  livox_bringup:
    image: livox_bringup:latest
    build: 
      context: ../src/livox_bringup
      tags:
        - livox_bringup:latest
    profiles: ["livox"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    stdin_open: true
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /dev/shm:/dev/shm
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env

  fastlio2_bringup:
    image : fastlio2_bringup:latest
    build: 
      context: ../src/fastlio2_bringup
      dockerfile: Dockerfile
    profiles: ["fastlio2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env
    environment:
      CONFIG_FILE: "mid360_mod.yaml"

  navigation_bringup:
    build: ../src/navigation_bringup
    profiles: ["navigation"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env

  localization_bringup:
    build: ../src/localization_bringup
    profiles: ["localization"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env

  pointcloud_to_laserscan_bringup:
    build: 
      context: ../src/pointcloud_to_laserscan_bringup
      dockerfile: Dockerfile
    profiles: ["pointcloud_to_laserscan", "fastlio2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    stdin_open: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env
  
  adaptive_odom_filter_bringup:
    build: 
      context: ../src/adaptive_filter_bringup
      dockerfile: Dockerfile
    profiles: ["adaptive_filter"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    stdin_open: true
    ipc: host
    devices:
      - "/dev:/dev"
    env_file:
      - ../config/.env
    environment:
      CONFIG_FILE: adaptive_filter_parameters.yaml