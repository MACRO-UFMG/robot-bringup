services:
  pioneer_bringup:
    build: ../src/pionner_bringup
    profiles: ["pionner"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    env_file:
      - ./bringup.env

  realsense2_camera_bringup:
    build: ../src/realsense2_camera_bringup
    profiles: ["realsense2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev:/dev"
    env_file:
      - ./bringup.env

  livox_bringup:
    build: 
      context: ../src/livox_bringup
      tags:
        - livox_bringup:latest
    profiles: ["livox"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    stdin_open: true
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /dev/shm:/dev/shm
    devices:
      - "/dev:/dev"
    env_file:
      - ./bringup.env

  fastlio2_bringup:
    build: 
      context: ../src/fastlio2_bringup
      dockerfile: Dockerfile
    profiles: ["fastlio2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev:/dev"
    env_file:
      - ./bringup.env
    environment:
      CONFIG_FILE: "mid360.yaml"

  nav2_bringup:
    build: ../src/nav2_bringup
    profiles: ["nav2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev:/dev"
    env_file:
      - ./bringup.env