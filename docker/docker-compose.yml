services:
  pioneer_bringup:
    build: ../src/pionner_bringup
    profiles: ["pionner"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    stop_signal: SIGINT
    environment:
      ROS_DOMAIN_ID: 11
      ROS_IP: 192.168.3.1
      ROS_HOSTNAME: 192.168.3.1
      ROS_AUTOMATIC_DISCOVERY_RANGE: SYSTEM_DEFAULT

  realsense2_camera_bringup:
    build: ../src/realsense2_camera_bringup
    profiles: ["realsense2"]
    network_mode: host
    command: /bin/bash
    privileged: true
    tty: true
    devices:
      - "/dev:/dev"
    environment:
      ROS_DOMAIN_ID: 11
      ROS_IP: 192.168.3.1
      ROS_HOSTNAME: 192.168.3.1
      ROS_AUTOMATIC_DISCOVERY_RANGE: SYSTEM_DEFAULT

